custom_fields:
  # Lista basada en la ficha real que pidió el consultorio (Bloque B del
  # cuestionario) — es lo mínimo que Karime necesita para tomar el caso sin
  # tener que re-preguntar nada. "Ciudad" (Q4iuXPJwWcJ1XO2L12Op) se creó en
  # una primera pasada y quedó sin usar, la reemplazó "Domicilio" — se puede
  # borrar a mano en GHL si se quiere, no se usa desde este archivo.
  fields:
    - id: 4nWdUMxpMna8uGM7zhDC
      name: Nombre completo (paciente)
      when: "En cuanto la paciente diga su nombre completo. Si solo da su nombre de pila, guarda lo que tengas y actualízalo si después da el apellido."
    - id: bGJYZqTt5dzHHw49GkvM
      name: Procedimiento de interés
      when: "Cuando el contacto deje claro qué procedimiento le interesa: rejuvenecimiento facial, levantamiento de busto, ambos, o cualquier otro de los que hace el doctor (liposucción, abdominoplastia, mommy makeover, rellenos, Botox, etc.). Si es lipectomía, guarda SIEMPRE la zona, 'lipectomía de cuello' o 'lipectomía de abdomen', nunca 'lipectomía' a secas, para que Karime no tenga que volver a preguntarlo."
    - id: CUBYVyKyNw2sQsEH4z8H
      name: Motivo de consulta
      when: "Cuando la paciente cuente qué le gustaría lograr o mejorar, con sus propias palabras."
    - id: P3GR7EWrfCS7T7ivfuzJ
      name: Temperatura
      when: "En cuanto tengas suficiente contexto para clasificar, guarda 'caliente' (lista para consulta, quiere agendar o ya pidió hablar con alguien), 'tibia' (interesada, hace preguntas concretas pero no ha pedido agendar) o 'fría' (apenas explorando, preguntas muy generales). Puedes actualizarlo si cambia durante la conversación."
    - id: LjVReDNX4OKduemrfaRb
      name: Edad
      when: "Cuando el contacto mencione su edad de forma natural en la conversación (nunca la preguntes de forma directa tipo formulario, solo guárdala si la comparte por su cuenta o al platicar del procedimiento)."
    - id: Blgx1nsrfUQLI9W0kz4W
      name: Fecha de nacimiento
      when: "Si la paciente la comparte (no es obligatorio pedirla si ya tienes la edad aproximada)."
    - id: A0Emi9BguJ5lRqouH88m
      name: Domicilio
      when: "Cuando la paciente mencione dónde vive, aunque sea solo la ciudad (útil sobre todo para pacientes foráneas)."
    - id: VuwBhPo6SqI76i2SA6RY
      name: Correo electrónico (paciente)
      when: "Si la paciente lo comparte, sobre todo relevante para valoración virtual (ahí se manda el link de pago)."
    - id: NbA9yxTIFCJDgha2PHSC
      name: Ocupación
      when: "Si sale de forma natural en la conversación, no la preguntes directo si no viene al caso."
    - id: 4GrjkJghJibn3GAXvqDy
      name: Recomendado por
      when: "Cuando la paciente mencione cómo se enteró del consultorio (si fue red social, especifica cuál)."
    - id: zBaLsSgeJWt8iiwx5A9f
      name: Preferencia de horario y días
      when: "Cuando la paciente diga qué días u horarios le acomodan mejor para su consulta, para que Karime no tenga que volver a preguntarlo. Guarda exactamente lo que diga aunque la fecha no parezca válida (ej. un día que no existe en ese mes), no lo cuestiones ni pidas que lo corrija, eso lo resuelve Karime directamente."
